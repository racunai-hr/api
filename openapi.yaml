components:
  schemas:
    Allocation:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: string
          description: Decimal as string, e.g. "1100.00"
        created_at:
          type: string
      required:
      - amount
      - created_at
      - id
    AmountsBlock:
      type: object
      properties:
        currency:
          type: string
          nullable: true
        net:
          type: string
          nullable: true
        vat:
          type: string
          nullable: true
        gross:
          type: string
          nullable: true
        fx_rate:
          $ref: '#/components/schemas/Provenanced'
      required:
      - currency
      - fx_rate
      - gross
      - net
      - vat
    Attachment:
      type: object
      properties:
        id:
          type: integer
        original_filename:
          type: string
        created_at:
          type: string
          nullable: true
        uploaded_by:
          type: string
          nullable: true
        download_available:
          $ref: '#/components/schemas/Provenanced'
      required:
      - created_at
      - download_available
      - id
      - original_filename
      - uploaded_by
    AuthMeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthMeUser'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/AuthMeTenant'
        platform_admin_url:
          type: string
      required:
      - platform_admin_url
      - tenants
      - user
    AuthMeTenant:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
        is_default:
          type: boolean
        admin_url:
          type: string
      required:
      - admin_url
      - is_default
      - name
      - role
      - slug
    AuthMeUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        is_superuser:
          type: boolean
      required:
      - email
      - id
      - is_superuser
      - username
    Balance:
      type: object
      properties:
        balance_type:
          type: string
        amount:
          type: string
          description: Decimal as string, e.g. "1100.00"
        currency:
          type: string
        as_of:
          type: string
          nullable: true
        source:
          type: string
        is_stale:
          type: boolean
      required:
      - amount
      - as_of
      - balance_type
      - currency
      - is_stale
      - source
    BankAccount:
      type: object
      properties:
        id:
          type: integer
        account_name:
          type: string
        bank_name:
          type: string
        account_number:
          type: string
        iban:
          type: string
        currency:
          type: string
        status:
          type: string
        is_active:
          type: boolean
        connection:
          allOf:
          - $ref: '#/components/schemas/ConnectionSummary'
          nullable: true
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
      required:
      - account_name
      - account_number
      - balances
      - bank_name
      - connection
      - currency
      - iban
      - id
      - is_active
      - status
    BankBlock:
      type: object
      properties:
        match_status:
          $ref: '#/components/schemas/Provenanced'
      required:
      - match_status
    BankingOverview:
      type: object
      properties:
        as_of:
          type: string
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankAccount'
        account_count_by_currency:
          type: object
          additionalProperties:
            type: integer
          description: Per-currency account counts; no cross-currency total balance
        unmatched_transaction_count:
          type: integer
        suggested_transaction_count:
          type: integer
        statement_count:
          type: integer
      required:
      - account_count_by_currency
      - accounts
      - as_of
      - statement_count
      - suggested_transaction_count
      - unmatched_transaction_count
    CodeDetail:
      type: object
      properties:
        code:
