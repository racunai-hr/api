components:
  schemas:
    AccountingBlock:
      type: object
      properties:
        journal_entry_id:
          type: integer
          nullable: true
        entry_number:
          type: string
          nullable: true
        entry_date:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        debit_total:
          type: string
          nullable: true
        credit_total:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AccountingLine'
      required:
      - credit_total
      - debit_total
      - entry_date
      - entry_number
      - journal_entry_id
      - lines
      - status
    AccountingLine:
      type: object
