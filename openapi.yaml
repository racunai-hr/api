openapi: 3.0.3
info:
  title: računAI API
  version: 1.0.0
  description: Tenant JWT REST ugovor za auth, documents, banking i partners. Fiscal/intermediary
    i AS4 nisu dio ove sheme. openapi.yaml je generirani artefakt — ne uređivati ručno.
paths:
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthorized:
                  value:
                    detail: Authentication credentials were not provided.
          description: Nedostaje ili je nevaljan Bearer token
  /api/auth/token/:
    post:
      operationId: auth_token_obtain
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthorized:
                  value:
                    detail: Authentication credentials were not provided.
          description: Nedostaje ili je nevaljan Bearer token
      security: []
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              examples:
                Unauthorized:
                  value:
                    detail: Authentication credentials were not provided.
          description: Nedostaje ili je nevaljan Bearer token
      security: []
