[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
addopts = -ra --reuse-db
markers =
    pts: PTS interoperability tests (run manually against PTS environment)
    pts_integration: Live PTS integration tests (never in default CI)
    benchmark: UBL pipeline performance regression tests
    soak: Extended UBL pipeline soak/load baseline tests
    otp_integration: Live OTP sandbox AIS E2E tests (never in default CI)
    otp_pis_integration: Live OTP sandbox PIS E2E tests (never in default CI)
